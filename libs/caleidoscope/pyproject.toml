[project]
name = "caleidoscope"
version = "0.1.0"
description = "Creating repeating patterns"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "nvcleemp" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=11.0.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
