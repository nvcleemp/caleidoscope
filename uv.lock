version = 1
revision = 1
requires-python = ">=3.13"

[manifest]
members = [
    "basic-examples",
    "caleidoscope",
    "caleidoscope-group",
]

[[package]]
name = "basic-examples"
version = "0.1.0"
source = { virtual = "examples/basic" }
dependencies = [
    { name = "caleidoscope" },
]

[package.metadata]
requires-dist = [{ name = "caleidoscope", editable = "libs/caleidoscope" }]

[[package]]
name = "caleidoscope"
version = "0.1.0"
source = { editable = "libs/caleidoscope" }

[[package]]
name = "caleidoscope-group"
version = "0.1.0"
source = { virtual = "." }
